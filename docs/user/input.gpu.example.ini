; MOSE_GPU input.ini -- annotated example (GPU dialect). Print it with:  mose example > input.ini
;
; Run a case from its folder (input.ini + INPUT/):
;   mose check               what the case needs, and whether the GPU runs it
;   mose solve -n 3          builds the matching binary if it does not exist yet, then runs
;
; mose chooses (and builds once) the binary from the case itself:
;   species count         = lines after the first of INPUT/phase.txt
;   chemical mechanism    = first word of INPUT/chemistry-info.txt (GPU: ONERA-7 or Frolov_nopressure);
;                           no such file = frozen flow
;   turbulence equations  = [MOSE-RANS] turbulence-model below (no [MOSE-RANS] section = Euler)
;   chemistry integrator  = [MOSE-ODE] solver below
; The other INPUT/ files come from ATLAS: ic.tec (or ic.szplt), bc.txt, thermo.dat, transport.dat,
; block_owner.txt (block -> MPI rank), diffusion.dat (only with schmidt <= 0).
;
; Syntax: a line starting with ; ! or # is a comment, text after ; on a value line is ignored.
; Section and key names are case-sensitive ([MOSE-parameters], not [MOSE-Parameters]).
; A key the code does not read is ignored without a message: mose check lists them.

[MOSE-parameters]
newrun = t                  ; t = start from INPUT/ic.*, f = restart from OUTPUT/field.* (default t)
cfl = 0.99                  ; required: the code stops without it
vnn = 0.3                   ; viscous stability number (default 0.3)
time-accurate = t           ; t = one global time step (unsteady), f = local time steps (default f)
time-threshold = 2.0e-5     ; stop at this physical time [s] ...
iter-threshold = 1000000    ; ... or after this many iterations
time-clip = t               ; the last step lands exactly on time-threshold (default f)
dump-clip = t               ; steps land exactly on the sol-dtime output instants (default f)

[MOSE-RANS]
; Delete this whole section for Euler (inviscid). On the GPU: SST, SST-RC or Wilcox2006 (2 equations), SA, SA-R,
; SA-RC or SAcomp (1) or laminar (0); SSGLRR and QCR2000 are not computed by the GPU kernels and mose stops them.
turbulence-model = SST
Prt = 0.85                  ; turbulent Prandtl number (default 0.85)
Sct = 0.90                  ; turbulent Schmidt number (default 0.90)
Sc = 0.7                    ; laminar Schmidt number (default 0.7)
point-implicit = f          ; Patankar treatment of the turbulence destruction terms, as MOSE_open (its default is t)
;omega-wall-bc = practical  ; SST / Wilcox2006 omega at a smooth wall: practical = 60/beta1 nu/d^2 (default) | asymptotic = 6/beta1 nu/d^2
;sst-production = incompressible ; SST production: incompressible = mu_t S^2 (default) | compressible = tau_ij du_i/dx_j

[MOSE-Physics]
; schmidt > 0 replaces [MOSE-RANS] Sc; schmidt <= 0 = mixture-averaged multicomponent diffusion
; (needs INPUT/diffusion.dat). Without the key the GPU uses Sc above; MOSE_open would default to multicomponent.
schmidt = 0.7

[MOSE-ODE]
; Chemistry integrator on the GPU: H-radau5 (default, production) or H-rodas (Hairer RODAS).
; Changing it needs the other binary: mose builds it.
solver = H-radau5
relative-tol-species = 1e-5     ; default 1e-5
absolute-tol-species = 1e-5     ; default 1e-5
relative-tol-pressure = 1e-5    ; last ODE unknown, the temperature (default 1e-5)
absolute-tol-pressure = 1e-5    ; default 1e-5

[MOSE-scheme]
;integration-variables = cons  ; cons (default), prim (MOSE_open Newstate_Primitive) or prec (Weiss-Smith preconditioning:
;                             ; preconditioning-Uref, -Mach, -eps-min (0.05), -Ur-min, -Ur-factor (1), -Ur-smooth (0))
RK = 2                      ; Runge-Kutta stages: 1, 2 or 3 (default 1)
limiter = MINMOD            ; MINMOD, VANLEER, VANALBADA, MC or SUPERBEE on the GPU (the default IORD is first order and stops the GPU run)
riemann = HLLC              ; HLLC (default), HLLE, SLAU, AUSM+, AUSM+M, HLLE++, HLLC+Tramel, LLF (Rusanov), SLAU2, HLLC+Chen,
                            ; exact, LMRoe, MiczekRoe, HLLC-PC (with prec): every solver of MOSE_open
;shock-detector = tramel    ; MOSE_open sensor: tramel | chen | none (default: HLLE++/HLLC+Tramel -> tramel, AUSM+M -> chen)
;riemann-options-Mco = 0.005 ; low-Mach cutoff, required by AUSM+M, HLLC+Chen and LMRoe, read by MiczekRoe
omega-source-relax = t      ; point-implicit SST destruction + omega floor, fixed constants (default f)
; The four keys below default to what MOSE_open does:
;wall-ghost = cubic          ; ghost cells at the viscous walls: cubic extrapolation (default) | mirror | zg | auto (mirror if any)
;extrapolation-ghost = cubic ; ghost cells of the extrapolation faces (400): cubic (default) | zero-gradient
;rans-wall-ghost = copy      ; wall ghost of the turbulence variables for their source terms: copy of the boundary cell (default)
                             ; | wall-value
;state-check = t             ; stop on p < 0 or a NaN after every update (default t)

[MOSE-IO]
shell-diter = 10            ; iterations between two shell lines (default 1)
diter-res = 10              ; iterations between two lines of the residual history
sol-format = tecplot ascii  ; tecplot ascii (default) | tecplot binary (szplt)
bck-format = tecplot ascii  ; format of the restart field (default: sol-format)
sol-dtime = 5.0e-7          ; physical time between two outputs (field, wall, residuals) [s]
sol-field-every = 1         ; the 3D field only at every N-th output (default 1): a large 3D field takes GBs
sol-overwrite = t           ; t = each output overwrites the previous files (default), f = a numbered file per output
wall-variables = mech thermal

[MOSE-probes]
probe1 = p_chamber

[p_chamber]
index-position = 11 20 52 70    ; block i j k
variables = p
dtime = 0.0                     ; 0 = every time step
